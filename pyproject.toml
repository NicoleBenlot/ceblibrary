[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "ceblibrary"
version = "0.3.0"
description = "Cebuano word-to-audio decoder library"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["ceblibrary*"]

# Model files (index.txt, assets/) live at the repo root, OUTSIDE the package,
# and are intentionally not shipped in the wheel. Apps copy the model dir into
# their models/ folder separately (small package, asset model pulled on demand).

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
